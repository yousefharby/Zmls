<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — 27 Juniors</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --dp: #070510;
            --dp2: #0e0920;
            --pu: #5b21b6;
            --pu2: #7c3aed;
            --lav: #a78bfa;
            --lav2: #c4b5fd;
            --pink: #e879f9;
            --white: #f0ebff;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--dp);
            color: var(--white);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── BLOBS ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .b1 {
            width: 600px;
            height: 600px;
            background: rgba(91, 33, 182, .15);
            top: -150px;
            right: -200px;
        }

        .b2 {
            width: 400px;
            height: 400px;
            background: rgba(124, 58, 237, .1);
            bottom: -100px;
            left: -100px;
        }

        /* ── LOGIN SCREEN ── */
        #login {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #04030d;
        }

        #login.hidden {
            display: none;
        }

        .login-card {
            width: 360px;
            background: rgba(124, 58, 237, .07);
            border: 1px solid rgba(167, 139, 250, .15);
            border-radius: 26px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(167, 139, 250, .1), transparent 50%, rgba(232, 121, 249, .07));
            z-index: -1;
        }

        .login-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #8b5cf6, #4c1d95 58%, #160830);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--lav2);
            box-shadow: 0 0 50px rgba(124, 58, 237, .45);
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .login-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: .25rem;
        }

        .login-sub {
            font-size: .75rem;
            color: rgba(167, 139, 250, .5);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .l-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }

        .l-group label {
            display: block;
            font-size: .62rem;
            letter-spacing: 2px;
            color: var(--lav);
            text-transform: uppercase;
            margin-bottom: .4rem;
        }

        .l-group input {
            width: 100%;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(167, 139, 250, .14);
            border-radius: 10px;
            padding: .8rem 1rem;
            color: var(--white);
            font-family: 'Syne', sans-serif;
            font-size: .88rem;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .l-group input:focus {
            border-color: rgba(167, 139, 250, .38);
            box-shadow: 0 0 20px rgba(124, 58, 237, .14);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--pu2), #9333ea);
            border: none;
            border-radius: 12px;
            padding: .9rem;
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: .88rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .3s;
            box-shadow: 0 8px 30px rgba(124, 58, 237, .3);
            margin-top: .5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(124, 58, 237, .45);
        }

        .login-err {
            color: #f87171;
            font-size: .78rem;
            margin-top: .8rem;
            display: none;
            font-family: 'Noto Kufi Arabic', sans-serif;
            direction: rtl;
        }

        .login-err.show {
            display: block;
        }

        /* ── ADMIN APP ── */
        #app {
            display: none;
            position: relative;
            z-index: 1;
        }

        #app.visible {
            display: block;
        }

        /* ── ADMIN NAV ── */
        .admin-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(24px);
            background: rgba(7, 5, 16, .65);
            border-bottom: 1px solid rgba(167, 139, 250, .08);
        }

        .admin-nav-logo {
            display: flex;
            align-items: center;
            gap: .7rem;
        }

        .admin-nav-logo .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #8b5cf6, #4c1d95);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            font-weight: 800;
            color: var(--lav2);
            overflow: hidden;
        }

        .admin-nav-logo .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .admin-nav-logo span {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--lav2), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-badge {
            font-size: .65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--pink);
            background: rgba(232, 121, 249, .08);
            border: 1px solid rgba(232, 121, 249, .2);
            border-radius: 100px;
            padding: .3rem .9rem;
        }

        .logout-btn {
            font-size: .7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(167, 139, 250, .4);
            background: none;
            border: 1px solid rgba(167, 139, 250, .12);
            border-radius: 100px;
            padding: .35rem .9rem;
            cursor: pointer;
            transition: all .3s;
        }

        .logout-btn:hover {
            color: var(--lav);
            border-color: rgba(167, 139, 250, .3);
        }

        /* ── ADMIN BODY ── */
        .admin-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(167, 139, 250, .08);
            border-radius: 14px;
            padding: .4rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: .7rem 1rem;
            border-radius: 10px;
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .3s;
            color: rgba(167, 139, 250, .4);
            font-weight: 600;
            border: none;
            background: none;
        }

        .tab.active {
            background: rgba(124, 58, 237, .2);
            color: var(--lav2);
            border: 1px solid rgba(167, 139, 250, .18);
        }

        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: .65rem;
            margin-left: .4rem;
            font-weight: 700;
        }

        .tab.active .tab-count {
            background: var(--pink);
            color: white;
        }

        .tab:not(.active) .tab-count {
            background: rgba(255, 255, 255, .07);
            color: rgba(167, 139, 250, .5);
        }

        /* ── STAT STRIP ── */
        .stat-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .strip-card {
            background: rgba(124, 58, 237, .06);
            border: 1px solid rgba(167, 139, 250, .1);
            border-radius: 16px;
            padding: 1.4rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .strip-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .strip-icon.pending {
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .2);
        }

        .strip-icon.approved {
            background: rgba(16, 185, 129, .1);
            border: 1px solid rgba(16, 185, 129, .2);
        }

        .strip-icon.total {
            background: rgba(124, 58, 237, .15);
            border: 1px solid rgba(167, 139, 250, .2);
        }

        .strip-num {
            font-family: 'Syne', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            line-height: 1;
        }

        .strip-lbl {
            font-size: .65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(167, 139, 250, .4);
            margin-top: .15rem;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        /* ── SUBMISSION CARD ── */
        .sub-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sub-card {
            background: rgba(255, 255, 255, .025);
            border: 1px solid rgba(167, 139, 250, .1);
            border-radius: 18px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: all .3s;
        }

        .sub-card:hover {
            background: rgba(255, 255, 255, .04);
            border-color: rgba(167, 139, 250, .2);
        }

        .sub-avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(167, 139, 250, .22);
            flex-shrink: 0;
        }

        .sub-avatar-ph {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #7c3aed, #2e1065);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            border: 2px solid rgba(167, 139, 250, .22);
        }

        .sub-info {
            flex: 1;
            min-width: 0;
        }

        .sub-name {
            font-family: 'Syne', sans-serif;
            font-size: .95rem;
            font-weight: 700;
            margin-bottom: .15rem;
        }

        .sub-nick {
            font-size: .65rem;
            letter-spacing: 2px;
            color: var(--pink);
            text-transform: uppercase;
            margin-bottom: .35rem;
        }

        .sub-quote {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: .8rem;
            color: rgba(196, 181, 253, .5);
            direction: rtl;
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub-meta {
            font-size: .65rem;
            color: rgba(167, 139, 250, .3);
            margin-top: .4rem;
        }

        .sub-actions {
            display: flex;
            gap: .6rem;
            flex-shrink: 0;
        }

        .btn-approve {
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(16, 185, 129, .25);
            color: #34d399;
            border-radius: 10px;
            padding: .55rem 1.1rem;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .3s;
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, .22);
            box-shadow: 0 0 20px rgba(16, 185, 129, .2);
        }

        .btn-reject {
            background: rgba(239, 68, 68, .08);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #f87171;
            border-radius: 10px;
            padding: .55rem 1.1rem;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .3s;
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, .18);
            box-shadow: 0 0 20px rgba(239, 68, 68, .15);
        }

        .btn-remove {
            background: rgba(239, 68, 68, .08);
            border: 1px solid rgba(239, 68, 68, .18);
            color: #f87171;
            border-radius: 10px;
            padding: .55rem 1rem;
            font-size: .72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, .18);
        }

        /* ── STATUS BADGE ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .62rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            padding: .3rem .7rem;
            border-radius: 100px;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, .1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, .2);
        }

        .status-badge.approved {
            background: rgba(16, 185, 129, .1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, .2);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: .3;
        }

        .empty-msg {
            font-family: 'Noto Kufi Arabic', sans-serif;
            color: rgba(167, 139, 250, .35);
            font-size: .9rem;
            direction: rtl;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(14px);
            background: rgba(13, 9, 28, .95);
            border: 1px solid rgba(167, 139, 250, .25);
            border-radius: 100px;
            padding: .7rem 1.8rem;
            color: var(--white);
            font-size: .8rem;
            backdrop-filter: blur(20px);
            opacity: 0;
            transition: all .4s;
            z-index: 9000;
            box-shadow: 0 0 30px rgba(124, 58, 237, .3);
            white-space: nowrap;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #toast.success {
            border-color: rgba(16, 185, 129, .3);
            box-shadow: 0 0 30px rgba(16, 185, 129, .2);
        }

        #toast.error {
            border-color: rgba(239, 68, 68, .3);
        }

        /* ── CONFIRM MODAL ── */
        #confirmModal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(4, 3, 13, .8);
            backdrop-filter: blur(8px);
        }

        #confirmModal.show {
            display: flex;
        }

        .modal-card {
            background: rgba(14, 9, 32, .95);
            border: 1px solid rgba(167, 139, 250, .18);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: .5rem;
        }

        .modal-sub {
            font-family: 'Noto Kufi Arabic', sans-serif;
            color: rgba(196, 181, 253, .5);
            font-size: .85rem;
            direction: rtl;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .modal-btns {
            display: flex;
            gap: .8rem;
            justify-content: center;
        }

        .modal-confirm {
            background: rgba(239, 68, 68, .15);
            border: 1px solid rgba(239, 68, 68, .3);
            color: #f87171;
            border-radius: 12px;
            padding: .75rem 1.8rem;
            font-family: 'Syne', sans-serif;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s;
        }

        .modal-confirm:hover {
            background: rgba(239, 68, 68, .28);
        }

        .modal-cancel {
            background: rgba(167, 139, 250, .07);
            border: 1px solid rgba(167, 139, 250, .15);
            color: var(--lav);
            border-radius: 12px;
            padding: .75rem 1.8rem;
            font-family: 'Syne', sans-serif;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s;
        }

        .modal-cancel:hover {
            background: rgba(167, 139, 250, .14);
        }

        /* ── RESPONSIVE ── */
        @media(max-width:700px) {
            .stat-strip {
                grid-template-columns: 1fr;
                gap: .7rem;
            }

            .admin-body {
                padding: 2rem 1rem;
            }

            .sub-card {
                flex-wrap: wrap;
            }

            .sub-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div id="toast"></div>

    <!-- ════════ CONFIRM MODAL ════════ -->
    <div id="confirmModal">
        <div class="modal-card">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title" id="modalTitle">تأكيد الحذف</div>
            <div class="modal-sub" id="modalSub">هل أنت متأكد إنك عايز تحذف هذا الطالب من الدفعة؟</div>
            <div class="modal-btns">
                <button class="modal-confirm" id="modalConfirmBtn">نعم، احذف</button>
                <button class="modal-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ════════ LOGIN ════════ -->
    <div id="login">
        <div class="blob b1" style="position:absolute"></div>
        <div class="blob b2" style="position:absolute"></div>
        <div class="login-card">
            <div class="login-logo">
                <img src="logo.jpeg" alt="logo" onerror="this.style.display='none';this.parentElement.textContent='27'">
            </div>
            <div class="login-title">Admin Panel</div>
            <div class="login-sub">27 Juniors · Secure Access</div>
            <div class="l-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="l-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password"
                    onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <button class="login-btn" onclick="doLogin()">✦ دخول</button>
            <div class="login-err" id="loginErr">❌ اسم المستخدم أو الباسورد غلط</div>
        </div>
    </div>

    <!-- ════════ ADMIN APP ════════ -->
    <div id="app">
        <nav class="admin-nav">
            <div class="admin-nav-logo">
                <div class="logo-icon">
                    <img src="logo.jpeg" alt="logo"
                        onerror="this.style.display='none';this.parentElement.textContent='27'">
                </div>
                <span>27 Juniors · Admin</span>
            </div>
            <div class="admin-nav-right">
                <div class="admin-badge">⚡ Yousef Harby</div>
                <button class="logout-btn" onclick="doLogout()">Logout</button>
            </div>
        </nav>

        <div class="admin-body">
            <!-- Stats -->
            <div class="stat-strip">
                <div class="strip-card">
                    <div class="strip-icon pending">⏳</div>
                    <div>
                        <div class="strip-num" id="statPending">0</div>
                        <div class="strip-lbl">في الانتظار</div>
                    </div>
                </div>
                <div class="strip-card">
                    <div class="strip-icon approved">✅</div>
                    <div>
                        <div class="strip-num" id="statApproved">0</div>
                        <div class="strip-lbl">تم القبول</div>
                    </div>
                </div>
                <div class="strip-card">
                    <div class="strip-icon total">👥</div>
                    <div>
                        <div class="strip-num" id="statTotal">0</div>
                        <div class="strip-lbl">إجمالي الطلبات</div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('pending',this)">⏳ انتظار <span class="tab-count"
                        id="tabPendingCount">0</span></button>
                <button class="tab" onclick="switchTab('approved',this)">✅ مقبولين <span class="tab-count"
                        id="tabApprovedCount">0</span></button>
            </div>

            <!-- Lists -->
            <div id="panelPending">
                <div class="sub-list" id="pendingList"></div>
            </div>
            <div id="panelApproved" style="display:none">
                <div class="sub-list" id="approvedList"></div>
            </div>
        </div>
    </div>

    <!-- ══ FIREBASE SDK ══ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot,
            doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // ══ FIREBASE CONFIG ══
        // 🔴 نفس الـ config اللي حطيتها في index.html
        // 🔴 FIRESTORE RULES المطلوبة (في Firebase Console → Firestore → Rules):
        // rules_version = '2';
        // service cloud.firestore {
        //   match /databases/{database}/documents {
        //     match /submissions/{docId} {
        //       allow read: if true;
        //       allow create: if true;
        //       allow update, delete: if true;  // للأدمن (بدون auth)
        //     }
        //   }
        // }
        const firebaseConfig = {
            apiKey: "AIzaSyBtpVpU6ez1Y0tZhBY6JxLVCKvGKFb-QdQ",
            authDomain: "juniors-2026.firebaseapp.com",
            projectId: "juniors-2026",
            storageBucket: "juniors-2026.firebasestorage.app",
            messagingSenderId: "545225229005",
            appId: "1:545225229005:web:cc5bece7bb752f30b39f84",
            measurementId: "G-YKLHZEQWT0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ══ AUTH CREDENTIALS ══
        const ADMIN_USER = 'يوسف حربي';
        const ADMIN_PASS = 'حربي';
        const SESSION_KEY = '27juniors_admin_session';

        // ══ STATE ══
        let allDocs = [];   // live cache of all Firestore docs
        let unsubscribe = null; // Firestore listener cleanup
        let pendingAction = null;

        // ══ AUTH ══
        window.doLogin = function () {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const err = document.getElementById('loginErr');

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem(SESSION_KEY, '1');
                err.classList.remove('show');
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.add('visible');
                startListener();
            } else {
                err.classList.add('show');
                document.getElementById('loginPass').value = '';
            }
        };

        window.doLogout = function () {
            sessionStorage.removeItem(SESSION_KEY);
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            document.getElementById('login').classList.remove('hidden');
            document.getElementById('app').classList.remove('visible');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            allDocs = [];
        };

        // Enter key on password field
        document.getElementById('loginPass').addEventListener('keydown', e => {
            if (e.key === 'Enter') window.doLogin();
        });

        // ══ FIRESTORE REALTIME LISTENER ══
        function startListener() {
            // Order by submittedAt so newest first
            const q = query(collection(db, 'submissions'), orderBy('submittedAt', 'desc'));

            unsubscribe = onSnapshot(q, snapshot => {
                allDocs = [];
                snapshot.forEach(docSnap => {
                    allDocs.push({ firestoreId: docSnap.id, ...docSnap.data() });
                });
                renderAll();
            }, err => {
                console.error('Firestore error:', err);
                showToast('⚠️ خطأ في الاتصال بالقاعدة', 'error');
            });
        }

        // ══ STATS ══
        function updateStats() {
            const pending = allDocs.filter(s => s.status === 'pending').length;
            const approved = allDocs.filter(s => s.status === 'approved').length;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statTotal').textContent = allDocs.length;
            document.getElementById('tabPendingCount').textContent = pending;
            document.getElementById('tabApprovedCount').textContent = approved;
        }

        // ══ FORMAT DATE ══
        function fmtDate(ts) {
            if (!ts) return '';
            // Firestore Timestamp object or ISO string
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleDateString('ar-EG', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ══ SANITIZE ══
        function san(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        // ══ BUILD CARD ══
        function buildCard(s, isPending) {
            const div = document.createElement('div');
            div.className = 'sub-card';
            div.dataset.fid = s.firestoreId;

            const avatarHtml = s.imageUrl
                ? `<img class="sub-avatar" src="${s.imageUrl}" alt="${san(s.name)}" loading="lazy">`
                : `<div class="sub-avatar-ph">🎓</div>`;

            if (isPending) {
                div.innerHTML = `
                ${avatarHtml}
                <div class="sub-info">
                    ${s.nick ? `<div class="sub-nick">${san(s.nick)}</div>` : ''}
                    <div class="sub-name">${san(s.name)}</div>
                    <div class="sub-quote">"${san(s.quote)}"</div>
                    <div class="sub-meta">📅 ${fmtDate(s.submittedAt)}</div>
                </div>
                <div class="sub-actions">
                    <button class="btn-approve" data-fid="${s.firestoreId}">✅ قبول</button>
                    <button class="btn-reject"  data-fid="${s.firestoreId}" data-name="${san(s.name)}">✕ رفض</button>
                </div>`;
            } else {
                div.innerHTML = `
                ${avatarHtml}
                <div class="sub-info">
                    ${s.nick ? `<div class="sub-nick">${san(s.nick)}</div>` : ''}
                    <div class="sub-name">${san(s.name)}</div>
                    <div class="sub-quote">"${san(s.quote)}"</div>
                    <div class="sub-meta">✅ تم القبول · ${fmtDate(s.approvedAt)}</div>
                </div>
                <div class="sub-actions">
                    <button class="btn-remove" data-fid="${s.firestoreId}" data-name="${san(s.name)}">🗑️ إزالة</button>
                </div>`;
            }

            // Attach button events
            div.querySelectorAll('[data-fid]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const fid = btn.dataset.fid;
                    const name = btn.dataset.name || '';
                    if (btn.classList.contains('btn-approve')) {
                        approveDoc(fid);
                    } else if (btn.classList.contains('btn-reject')) {
                        openModal('reject', fid, name);
                    } else if (btn.classList.contains('btn-remove')) {
                        openModal('remove', fid, name);
                    }
                });
            });

            return div;
        }

        // ══ RENDER ALL ══
        function renderAll() {
            updateStats();
            renderPending();
            renderApproved();
        }

        function renderPending() {
            const list = document.getElementById('pendingList');
            const pending = allDocs
                .filter(s => s.status === 'pending')
                .sort((a, b) => {
                    const ta = a.submittedAt?.toDate?.() || new Date(a.submittedAt || 0);
                    const tb = b.submittedAt?.toDate?.() || new Date(b.submittedAt || 0);
                    return tb - ta;
                });

            list.innerHTML = '';
            if (pending.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-msg">مفيش طلبات في الانتظار — كل حاجة اتراجعت</div></div>`;
                return;
            }
            pending.forEach(s => list.appendChild(buildCard(s, true)));
        }

        function renderApproved() {
            const list = document.getElementById('approvedList');
            const approved = allDocs
                .filter(s => s.status === 'approved')
                .sort((a, b) => {
                    const ta = a.approvedAt?.toDate?.() || new Date(a.approvedAt || 0);
                    const tb = b.approvedAt?.toDate?.() || new Date(b.approvedAt || 0);
                    return tb - ta;
                });

            list.innerHTML = '';
            if (approved.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-msg">مفيش طلاب مقبولين لحد دلوقتي</div></div>`;
                return;
            }
            approved.forEach(s => list.appendChild(buildCard(s, false)));
        }

        // ══ APPROVE ══
        async function approveDoc(fid) {
            try {
                await updateDoc(doc(db, 'submissions', fid), {
                    status: 'approved',
                    approvedAt: serverTimestamp()
                });
                showToast('✅ تم قبول الطالب وظهر في الموقع فوراً', 'success');
            } catch (err) {
                console.error('Approve error:', err);
                showToast('❌ خطأ أثناء القبول، حاول تاني', 'error');
            }
        }

        // ══ DELETE ══
        async function deleteDoc_(fid) {
            try {
                await deleteDoc(doc(db, 'submissions', fid));
            } catch (err) {
                console.error('Delete error:', err);
                showToast('❌ خطأ أثناء الحذف', 'error');
            }
        }

        // ══ MODAL ══
        function openModal(type, fid, name) {
            pendingAction = { type, fid };
            if (type === 'reject') {
                document.getElementById('modalTitle').textContent = 'رفض الطلب';
                document.getElementById('modalSub').textContent = `هل تريد رفض طلب "${name}"؟ سيتم حذفه نهائياً.`;
                document.getElementById('modalConfirmBtn').textContent = 'نعم، ارفض';
            } else {
                document.getElementById('modalTitle').textContent = 'إزالة من الدفعة';
                document.getElementById('modalSub').textContent = `هل تريد إزالة "${name}" من الدفعة نهائياً؟`;
                document.getElementById('modalConfirmBtn').textContent = 'نعم، احذف';
            }
            document.getElementById('confirmModal').classList.add('show');
        }

        window.closeModal = function () {
            document.getElementById('confirmModal').classList.remove('show');
            pendingAction = null;
        };

        document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
            if (!pendingAction) return;
            const { type, fid } = pendingAction;
            closeModal();
            await deleteDoc_(fid);
            showToast(
                type === 'reject' ? '🗑️ تم رفض وحذف الطلب' : '🗑️ تم إزالة الطالب من الدفعة',
                'error'
            );
        });

        document.getElementById('confirmModal').addEventListener('click', e => {
            if (e.target === document.getElementById('confirmModal')) window.closeModal();
        });

        // ══ TABS ══
        window.switchTab = function (name, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panelPending').style.display = name === 'pending' ? 'block' : 'none';
            document.getElementById('panelApproved').style.display = name === 'approved' ? 'block' : 'none';
        };

        // ══ TOAST ══
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = type + ' show';
            clearTimeout(t._t);
            t._t = setTimeout(() => t.className = '', 3200);
        }

        // ══ AUTO LOGIN IF SESSION EXISTS ══
        if (sessionStorage.getItem(SESSION_KEY) === '1') {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.add('visible');
            startListener();
        }

    </script>
</body>
